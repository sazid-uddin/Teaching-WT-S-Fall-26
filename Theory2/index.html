<!DOCTYPE html>
<html lang="en">
<head>
	<title>DOM Manipulation Demo</title>
</head>
<body>
	<script>
		function manipulate_dom() {
			// alert("Button was clicked!");
			var paragraph = document.createElement("p");
			paragraph.innerText = "Hello from JS";
			document.body.appendChild(paragraph);
		}
	</script>
	<h1>DOM Manipulation</h1>
	<button onclick="manipulate_dom()">Click Me!</button>
</body>
</html>
