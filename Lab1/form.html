<!DOCTYPE html>
<html>
<head>
	<title>HTML Form</title>
</head>
<body>
	<h3>Account Creation Form</h3>
	<form action="form-handler.html" method="get">
		<label for="first-name">First Name:</label>
		<input type="text" id="first-name" name="fn" placeholder="Enter your first name" minlength="3" required>
		<br>
		<label for="last-name">Last Name:</label>
		<input type="text" id="last-name" name="ln" placeholder="Enter your last name" minlength="3" required>
		<br>
		<label for="email">Email:</label>
		<input type="email" id="email" name="em" placeholder="Enter your email" required>
		<br>
		<label for="password">Password:</label>
		<input type="password" id="password" name="ps" placeholder="Enter your password" required>
		<br>
		<label for="confirm_password">Confirm password:</label>
		<input type="password" id="confirm_password" name="cps" placeholder="Enter confirm your password" required>
		<br>
		<br>
		<input type="submit" value="Create Your Account">
		<input type="reset">
	</form>	
</body>
</html>
