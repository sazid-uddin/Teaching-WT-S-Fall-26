<!doctype html>
<html>
    <head>
        <title>HTML Form</title>
    </head>
    <body>
		<script>
			function validator() {
				// email ends with aiub.edu
				let emailInput = document.getElementById("email");
				let email = emailInput.value;

				if (email === "") {
					// alert("Email is required");
					document.getElementById("email_error").innerText = "Email is required";
					return false;
				}

				if (!email.endsWith("@aiub.edu")) {
					document.getElementById("email_error").innerText = "Email must end with aiub.edu";
					return false;
				}

				str.contains("@")


				document.getElementById("email_error").innerText = "";
				return true;
			}

			function run_animation() {

			}

			document.onload(run_animation);
			document.addEventListener("DOMContentLoaded", run_animation);
		</script>
        <h3>Account Creation Form</h3>
        <form onsubmit="return validator()" action="form-handler.html" method="post">
            <fieldset>
				<legend>Names</legend>
                <label for="first-name">First Name:</label>
                <input type="text" class="name-field" id="first-name" name="fn" placeholder="Enter your first name" minlength="3" required />
                <br />
                <label for="last-name">Last Name:</label>
                <input type="text" class="name-field" id="last-name" name="ln" placeholder="Enter your last name" minlength="3" required />
            </fieldset>
            <br />
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="100" required />
            <br />
            <label for="gender">Gender:</label>
            <br />
            <input type="radio" name="gender" id="male" /> Male
            <br />
            <input type="radio" name="gender" id="female" /> Female
            <br />
            <input type="radio" name="gender" id="other" /> Other
            <br />
            <select>
                <option value="">Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br />
            <label for="email">Email:</label>
            <input onkeyup="validator()" type="email" id="email" name="em" placeholder="Enter your email"/>
			<span id="email_error" style="color: red; font-size: smaller"></span>
            <br />
            <label for="password">Password:</label>
            <input type="password" id="password" name="ps" placeholder="Enter your password" required />
            <br />
            <label for="confirm_password">Confirm password:</label>
            <input type="password" id="confirm_password" name="cps" placeholder="Enter confirm your password" required />
            <br />
            <input type="checkbox" /> Agree to <a href="terms.html">Terms & Conditions</a>
            <input type="range" />
            <br />
            <textarea name="" id=""></textarea>
            <br />
            <button>Click Me!</button>
            <br />
            <br />
            <input type="submit" value="Create Your Account" />
            <input type="reset" />
        </form>
    </body>
</html>
