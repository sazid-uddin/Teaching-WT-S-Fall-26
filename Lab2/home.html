<!DOCTYPE html>
<head>
	<title>CSS</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<style>
		h1 {
			color: aqua;
		}

		a:visited {
			color: grey;
		}

		a[target] {
			font-style: italic;
		}

		a[target="_blank"] {
			font-weight: bold;
		}
	</style>
	<h1>Home Page</h1>
	<a target="_blank" href="index.html">Go back</a>
	<a target="_self" href="index.html">Go back</a>
	<a href="https://google.com">Google</a>
	<h1>This is another h1. H1's are block-level elements</h1>
	<p style="background-color: blueviolet; font-weight: normal;">CSS is way to style HTML elements.</p>
	<span class="my-span" id="span1">This is a span. It is an inline element</span>
	<span class="my-span">This is a second span</span>
	<span class="my-span">3rd span</span>
	<p>This is another paragraph</p>
</body>
</>
